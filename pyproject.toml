[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-cloudtube"
version = "0.1.0"
description = "MCP server exposing Google Drive storage and YouTube publishing to AI clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Every entry here is imported directly by src/. Nothing in this list does
# the assignment's core work: the Drive and YouTube clients, the resumable
# upload loop, the retry policy and the circuit breaker are all written in
# this repository. The only API libraries are Google's own official SDKs and
# Anthropic's official MCP SDK.
#
# Deliberately absent: a retry library (resilience.py implements the policy,
# because it needs to distinguish a rate limit from a spent quota, which a
# generic retry helper cannot), and any third-party Drive or YouTube wrapper.
# uvicorn and starlette are not listed because they arrive with mcp and are
# never imported here.
dependencies = [
    "mcp>=1.2.0",                      # official MCP SDK (protocol only)
    "google-api-python-client>=2.150.0",  # official Google API client
    "google-auth>=2.35.0",             # official Google auth
    "google-auth-oauthlib>=1.2.1",     # official Google OAuth helper
    "pydantic>=2.9.0",                 # tool argument + domain models
    "pydantic-settings>=2.6.0",        # configuration
    "structlog>=24.4.0",               # structured logging
    "anyio>=4.6.0",                    # thread offload, deadlines
    "pypdf>=5.1.0",                    # PDF text extraction
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
mcp-cloudtube = "mcp_cloudtube.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cloudtube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# basetemp is pinned inside the project so the suite does not depend on the
# state of the system temp directory, which on a developer machine can carry
# stale, permission-broken directories from unrelated tools.
# Integration tests are excluded by default: they need a connected Google
# account, which a reviewer may not have set up yet. `pytest -m integration`
# overrides this, because command-line -m wins over addopts.
addopts = "-ra --strict-markers --basetemp=.pytest-tmp -m 'not integration'"
markers = [
    "integration: talks to the real Google APIs; needs a connected account. Read-only and cheap. Run with: pytest -m integration",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Lines in these files carry the pre-commit hook's `cloudtube:allow-secret-pattern`
# marker. The hook matches it per line, so the line cannot be wrapped to fit.
"tests/unit/test_errors.py" = ["E501"]
"tests/integration/test_tool_surface.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
